<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>FORMS IN HTML</h1>

    <form> 
        <label> NAME:</label>
        <input type="text" required>
        <br><br>
        <label> number:</label>
        <input type="number" placeholder="enter your number" >
        <br><br>
        <label>age:</label>
        <input type="number" min="3" max="80" required>
        <br><br>
        <label>gender:</label>
        <input type="radio" name="gender" value="radio">male
        <input type="radio" name="gender" value="radio">female
        <input type="radio" name="gender" value="radio">other
        <br><br>
        <label>hobbies:</label>
        <input type="checkbox" value="chess">chess
        <input type="checkbox" value="reading">reading
        <input type="checkbox" value="dancing">dancing
        <br><br>
        <label>game:</label>
        <select name="outdoor">
            <option value="tennis">tennis</option>
            
            <option value="football">football</option>
            <option value="runnig">runnig</option>
            <option value="cricket">cricket</option>
        </select>
        <br><br>
        <button type="submit">click me 

        </button>


    </form>
</body>
</html>
